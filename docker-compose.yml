services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-artex}
      # Keep PGDATA one level below the mount point. initdb refuses a non-empty
      # data directory, and some filesystems drop a lost+found into a fresh one.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      # Bind mount, not a named volume: everything lives inside this folder, so
      # copying the folder to another machine carries the database with it.
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artex} -d ${POSTGRES_DB:-artex}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  artex:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        ARTEX_VERSION: ${ARTEX_VERSION:-0.3.15}
        WITH_CHROMIUM: ${WITH_CHROMIUM:-1}
        WITH_RECON: ${WITH_RECON:-1}
    # Local tag by default. Set ARTEX_IMAGE to a registry path to move the image
    # between machines with docker push / docker compose pull instead of a build.
    image: ${ARTEX_IMAGE:-artex:local}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARTEX_PG_DSN: postgres://${POSTGRES_USER:-artex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artex}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
      # Chromium runs as root in this container, so the sandbox must be off.
      # playwright-cli has no CLI flag for it; the MCP is launched with
      # --no-sandbox instead. See README, section "Browser".
    ports:
      - "8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      # Both persistent paths are bind mounts so a folder copy moves everything:
      #   data/   jwt.key, SQLite, recorded traffic, mitm CA
      #   skills/ skills you add or edit
      - ./data:/app/data
      - ./skills:/app/skills
    restart: unless-stopped
